<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<title>404 — assets.la.io</title>
<meta name="robots" content="noindex">
<style>@font-face{font-family:'Aktiv Grotesk';src:url('/fonts/AktivGrotesk_Lt.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Aktiv Grotesk';src:url('/fonts/AktivGrotesk_Rg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Aktiv Grotesk';src:url('/fonts/AktivGrotesk_Bd.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --dark:#01233C; --easy:#63DCDE; --electric:#00B9FE;
  --rule:rgba(99,220,222,.22); --rule-soft:rgba(99,220,222,.12);
  --body:rgba(255,255,255,.72);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--dark);color:#fff;
  font-family:'Aktiv Grotesk',Helvetica Neue,Helvetica,Arial,sans-serif;
  font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;letter-spacing:.1em;font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
@media(max-width:640px){.wrap{padding:0 20px}}

body{min-height:100vh;display:flex;align-items:center}
.wrap{width:100%}
.eyebrow{font-size:12px;color:var(--electric);margin:0 0 30px;letter-spacing:.16em;font-weight:700}
h1{font-weight:300;font-size:clamp(28px,4.4vw,46px);line-height:1.15;margin:0;
  letter-spacing:-.02em;max-width:18ch}
h1 a{color:var(--electric);text-decoration:none;border-bottom:1px solid rgba(0,185,254,.35)}
h1 a:hover{border-bottom-color:var(--electric)}
.code{margin-top:44px;font-size:11px;color:rgba(255,255,255,.34);letter-spacing:.12em}
</style></head>
<body><div class="wrap">
<p class="eyebrow mono">ASSETS.LA.IO</p>
<h1>Nothing here. Try <a href="/">assets.la.io</a>.</h1>
<p class="code mono">404</p>
</div></body></html>
