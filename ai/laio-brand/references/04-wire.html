<!doctype html>
<!--
  LA.IO RANGE REFERENCE 04: THE WIRE
  Hairline connections with open-square terminals, for anything that relates:
  org charts, hub and spoke, callouts.

  + Rule: a 1px rule in the easy color. Terminals are small open squares
    (LAIO-WIRE-NODE, drawn at 8px so its line matches the wire).
  + Rule: lines run at 0 or 90 degrees only.
  + Don't: arrows, curves, or diagonal wires.

  Family: Gray. Dark #231F20, easy #E3E6E7, mid #929497.
  Shape count: two (the wire and its node). The logo and type do not count.

  This file is a reference. Read the structure, then build your own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LA.IO Range 04: The Wire</title>
<!-- Aktiv Grotesk and JetBrains Mono, embedded. Renders offline. -->
<link rel="stylesheet" href="../assets/fonts/laio-fonts-inline.css">
<style>
  :root {
    --dark: #231F20;
    --easy: #E3E6E7;
    --mid: #929497;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--dark); }
  .canvas {
    position: relative; width: 1600px; height: 900px; overflow: hidden;
    background: var(--dark); color: var(--white);
    font-family: 'Aktiv Grotesk', 'Roboto', system-ui, sans-serif;
  }
  svg { display: block; }

  .headline {
    position: absolute; left: 120px; top: 104px; margin: 0;
    font-weight: 300; font-size: 50px; line-height: 1.12; letter-spacing: -0.01em;
  }
  .headline b { font-weight: 700; }

  /* The hub. */
  .logo { position: absolute; left: 610px; top: 318px; width: 380px; color: var(--easy); }

  /* Wires: 1px, easy color, 0 or 90 degrees. Every end gets a node. */
  .w { position: absolute; background: var(--easy); }
  .h { height: 1px; }
  .v { width: 1px; }
  .node { position: absolute; width: 8px; height: 8px; color: var(--easy); }

  .label {
    position: absolute; top: 712px; width: 360px; margin-left: -180px; text-align: center;
    font-weight: 300; font-size: 44px; line-height: 1.2;
  }
  .label span { color: var(--easy); font-weight: 400; margin-right: 14px; }
</style>
</head>
<body>
<div class="canvas">

  <h1 class="headline">Louisiana Innovation<br>Creates <b>Global</b> Solutions</h1>

  <svg class="logo" viewBox="0 0 280.17 67.88" role="img" aria-label="LA.IO">
    <g fill="currentColor">
      <path d="M66.14,19.91v22.03h14.23v6.89h-22.03v-28.92h7.8Z"/>
      <path d="M107.72,43.23h-8.58l-1.56,5.6h-7.57l8.86-28.92h9.55l8.86,28.92h-7.99l-1.56-5.6ZM100.79,37.4h5.32l-2.57-9.18h-.18l-2.57,9.18Z"/>
      <path d="M134.3,40.02h8.81v8.81h-8.81v-8.81Z"/>
      <path d="M162.67,48.83v-6.75h7.21v-15.42h-7.21v-6.75h22.22v6.75h-7.21v15.42h7.21v6.75h-22.22Z"/>
      <path d="M208.85,49.38c-7.44,0-12.99-6.11-12.99-15.01s5.55-15.01,12.99-15.01,12.99,6.1,12.99,15.01-5.55,15.01-12.99,15.01ZM208.85,26.25c-3.12,0-5.1,3.21-5.1,8.12s1.97,8.12,5.1,8.12,5.09-3.21,5.09-8.12-1.97-8.12-5.09-8.12Z"/>
      <polygon points="14.73 33.94 41.3 60.51 33.94 67.88 0 33.94 33.94 0 41.3 7.36 14.73 33.94"/>
      <polygon points="265.45 33.94 238.87 7.36 246.24 0 280.17 33.94 246.24 67.88 238.87 60.51 265.45 33.94"/>
    </g>
  </svg>

  <!-- Trunk: node under the hub, down to the bus. -->
  <svg class="node" style="left:796px; top:440px" viewBox="0 0 8.56 8.56" aria-hidden="true"><path fill="currentColor" d="M0,0v8.56h8.56V0H0ZM7.49,7.49H1.07V1.07h6.42v6.42Z"/></svg>
  <div class="w v" style="left:800px; top:448px; height:152px"></div>

  <!-- Bus. -->
  <div class="w h" style="left:380px; top:600px; width:841px"></div>

  <!-- Three drops, each ending in a node above its label. -->
  <div class="w v" style="left:380px;  top:600px; height:80px"></div>
  <div class="w v" style="left:800px;  top:600px; height:80px"></div>
  <div class="w v" style="left:1220px; top:600px; height:80px"></div>
  <svg class="node" style="left:376px;  top:680px" viewBox="0 0 8.56 8.56" aria-hidden="true"><path fill="currentColor" d="M0,0v8.56h8.56V0H0ZM7.49,7.49H1.07V1.07h6.42v6.42Z"/></svg>
  <svg class="node" style="left:796px;  top:680px" viewBox="0 0 8.56 8.56" aria-hidden="true"><path fill="currentColor" d="M0,0v8.56h8.56V0H0ZM7.49,7.49H1.07V1.07h6.42v6.42Z"/></svg>
  <svg class="node" style="left:1216px; top:680px" viewBox="0 0 8.56 8.56" aria-hidden="true"><path fill="currentColor" d="M0,0v8.56h8.56V0H0ZM7.49,7.49H1.07V1.07h6.42v6.42Z"/></svg>

  <p class="label" style="left:380px"><span>+</span>Capital</p>
  <p class="label" style="left:800px"><span>+</span>Coaching</p>
  <p class="label" style="left:1220px"><span>+</span>Connections</p>

</div>
</body>
</html>
