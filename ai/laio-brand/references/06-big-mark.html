<!doctype html>
<!--
  LA.IO RANGE REFERENCE 06: THE BIG MARK
  The logo at supergraphic scale, cropped past the edges.

  + Rule: legibility is the only limit.
  + Rule: when a lockup is needed, pair it with an L-corner (LAIO-CORNER-L)
    holding the vertical LOUISIANA INNOVATION wordmark (LOUISIANA-INNOVATION-B,
    turned 90 degrees so it reads bottom to top).
  + Don't: add brackets around it, or scale it up and leave it fully inside
    the frame.

  Family: Magenta. Dark #101948, easy #E385FE, electric #F629CB.
  Shape count: one (the L-corner). The logo and type do not count.

  This file is a reference. Read the structure, then build your own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LA.IO Range 06: The Big Mark</title>
<!-- Aktiv Grotesk and JetBrains Mono, embedded. Renders offline. -->
<link rel="stylesheet" href="../assets/fonts/laio-fonts-inline.css">
<style>
  :root {
    --dark: #101948;
    --easy: #E385FE;
    --electric: #F629CB;
    --white: #FFFFFF;

    /* LAIO-CORNER-L is a 39.44 box with an 8.56 stroke. */
    --corner: 300px;
    --stroke: calc(var(--corner) * 8.56 / 39.44);   /* 65.11px */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--dark); }
  .canvas {
    position: relative; width: 1600px; height: 900px; overflow: hidden;
    background: var(--dark); color: var(--white);
    font-family: 'Aktiv Grotesk', 'Roboto', system-ui, sans-serif;
  }
  svg { display: block; }

  .headline {
    position: absolute; left: 120px; top: 150px; margin: 0;
    font-weight: 300; font-size: 80px; line-height: 1.06; letter-spacing: -0.02em;
  }

  /* The mark: 1840px wide on a 1600px canvas. Both chevrons run off the
     sides and off the bottom. The letters stay whole, so it stays legible. */
  .mark { position: absolute; left: -120px; top: 560px; width: 1840px; color: var(--easy); }

  /* The L-corner. Its foot runs off the right edge. */
  .corner { position: absolute; left: 1340px; top: 160px; width: var(--corner); height: var(--corner); color: var(--easy); }

  /* The vertical wordmark, locked beside the L's bar and above its foot.
     Gap to the bar is half a stroke. Its base sits one stroke above the foot. */
  .wordmark {
    position: absolute; color: var(--easy);
    left: calc(1340px + var(--stroke) * 1.5);
    top: calc(160px + var(--corner) - var(--stroke) * 2 - 280px);
    width: 59.66px; height: 280px;   /* the file's 48.46 x 227.44, turned */
  }
</style>
</head>
