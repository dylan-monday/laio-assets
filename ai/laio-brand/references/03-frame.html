<!doctype html>
<!--
  DEFAULT: THE PLAIN PAGE
  In any deck, at most one slide in three carries a move. A five-slide deck
  gets one or two, never more. The opener may carry a move. The closer may
  carry a move. If both do, no other slide does. Between them, every slide is
  a plain page unless it is a single number or a single sentence with nothing
  else on it. When in doubt, plain page. Full limits: RANGE.md section 2.

  LA.IO RANGE REFERENCE 03: THE FRAME
  Two corner brackets around a headline, top-left and bottom-right, or a
  chevron pair flanking a title.

  + Rule: frames hold type only.
  + Rule: brackets sit outside the type's bounding box. Clear space is the
    bracket's stroke width times four.
  + Don't: frame the logo, or close all four corners.

  Family: Orange, on a light ground. Type and brackets in dark #302511 on
  white. Easy #F1DC43 and electric #F5C124 are too light to carry type or a
  bracket on white, so neither appears.
  Shape count: one (the corner, used twice). The logo and type do not count.

  This file is a reference. Read the structure, then build your own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LA.IO Range 03: The Frame</title>
<!-- Aktiv Grotesk and JetBrains Mono, embedded. Renders offline. -->
<link rel="stylesheet" href="../assets/fonts/laio-fonts-inline.css">
<style>
  :root {
    --dark: #302511;
    --white: #FFFFFF;

    /* The corner motifs are a 39.44 box with an 8.56 stroke. At 180px the
       stroke is heavy enough to hold its own against a 104px headline. */
    --corner: 180px;
    --stroke: calc(var(--corner) * 8.56 / 39.44);   /* 39.07px */
    --clear: calc(var(--stroke) * 4);                /* 156.27px */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--white); }
  .canvas {
    position: relative; width: 1600px; height: 900px; overflow: hidden;
    background: var(--white); color: var(--dark);
    font-family: 'Aktiv Grotesk', 'Roboto', system-ui, sans-serif;
  }
  svg { display: block; }

  /* The frame wraps the headline. Its padding is the bracket's stroke plus the
     clear space, so each bracket's inner edge sits exactly four strokes from
     the type's bounding box. */
  .frame {
    position: absolute; left: 50%; top: 432px; transform: translate(-50%, -50%);
    padding: calc(var(--stroke) + var(--clear));
  }
  .corner { position: absolute; width: var(--corner); height: var(--corner); color: var(--dark); }
  .corner.tl { top: 0; left: 0; }
  .corner.br { bottom: 0; right: 0; }

  .frame h1 {
    margin: 0; white-space: nowrap;
    font-weight: 300; font-size: 104px; line-height: 1.04; letter-spacing: -0.02em;
  }
  .frame h1 b { font-weight: 700; }

  .logo { position: absolute; left: 50%; bottom: 72px; width: 150px; margin-left: -75px; color: var(--dark); }
</style>
</head>
<body>
<div class="canvas">

  <div class="frame">
    <!-- LAIO-BRACKET-CORNER-1 -->
    <svg class="corner tl" viewBox="0 0 39.44 39.44" aria-hidden="true">
      <polygon fill="currentColor" points="8.56 8.56 8.56 39.44 0 39.44 0 0 39.44 0 39.44 8.56 8.56 8.56"/>
    </svg>
    <!-- LAIO-BRACKET-CORNER-2 -->
    <svg class="corner br" viewBox="0 0 39.44 39.44" aria-hidden="true">
      <polygon fill="currentColor" points="30.88 30.88 0 30.88 0 39.44 39.44 39.44 39.44 0 30.88 0 30.88 30.88"/>
    </svg>
    <h1>The <b>Future</b> Flows<br>Through Louisiana</h1>
  </div>

  <svg class="logo" viewBox="0 0 280.17 67.88" role="img" aria-label="LA.IO">
    <g fill="currentColor">
      <path d="M66.14,19.91v22.03h14.23v6.89h-22.03v-28.92h7.8Z"/>
      <path d="M107.72,43.23h-8.58l-1.56,5.6h-7.57l8.86-28.92h9.55l8.86,28.92h-7.99l-1.56-5.6ZM100.79,37.4h5.32l-2.57-9.18h-.18l-2.57,9.18Z"/>
      <path d="M134.3,40.02h8.81v8.81h-8.81v-8.81Z"/>
      <path d="M162.67,48.83v-6.75h7.21v-15.42h-7.21v-6.75h22.22v6.75h-7.21v15.42h7.21v6.75h-22.22Z"/>
      <path d="M208.85,49.38c-7.44,0-12.99-6.11-12.99-15.01s5.55-15.01,12.99-15.01,12.99,6.1,12.99,15.01-5.55,15.01-12.99,15.01ZM208.85,26.25c-3.12,0-5.1,3.21-5.1,8.12s1.97,8.12,5.1,8.12,5.09-3.21,5.09-8.12-1.97-8.12-5.09-8.12Z"/>
      <polygon points="14.73 33.94 41.3 60.51 33.94 67.88 0 33.94 33.94 0 41.3 7.36 14.73 33.94"/>
      <polygon points="265.45 33.94 238.87 7.36 246.24 0 280.17 33.94 246.24 67.88 238.87 60.51 265.45 33.94"/>
    </g>
  </svg>

</div>
</body>
</html>
