<!doctype html>
<!--
  DEFAULT: THE PLAIN PAGE
  In any deck, at most one slide in three carries a move. A five-slide deck
  gets one or two, never more. The opener may carry a move. The closer may
  carry a move. If both do, no other slide does. Between them, every slide is
  a plain page unless it is a single number or a single sentence with nothing
  else on it. When in doubt, plain page. Full limits: RANGE.md section 2.

  LA.IO RANGE REFERENCE 05: THE GRID
  A four-up photo grid where the plus is the gutter.

  + Rule: the plus sits at the exact center in the accent color. Its arms are
    the gutters.
  + Rule: photos are all duotoned in the family, or all untreated.
  + Don't: mix treatments, or use a plus that isn't the gutter.

  Family: Green. Dark #172708, easy #C8ED5D, electric #96F90B.
  No photography ships with the kit, so each photo is a flat rectangle of the
  easy color at low opacity over the dark ground: one duotone treatment, four
  frames. Swap in real photos duotoned to the family. Subjects follow BRAND.md:
  real work, real Louisiana places.
  Shape count: one (the plus). The photos and type do not count.

  This file is a reference. Read the structure, then build your own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LA.IO Range 05: The Grid</title>
<!-- Aktiv Grotesk and JetBrains Mono, embedded. Renders offline. -->
<link rel="stylesheet" href="../assets/fonts/laio-fonts-inline.css">
<style>
  :root {
    --dark: #172708;
    --easy: #C8ED5D;
    --electric: #96F90B;

    /* LAIO-PLUS is a 70.49 box with an 8.73 stroke. The gutter is the stroke. */
    --plus: 180px;
    --gutter: calc(var(--plus) * 8.73 / 70.49);   /* 22.29px */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--dark); }
  .canvas {
    position: relative; width: 1600px; height: 900px; overflow: hidden;
    background: var(--dark);
    font-family: 'Aktiv Grotesk', 'Roboto', system-ui, sans-serif;
  }
  svg { display: block; }
  .mono {
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
  }

  .grid {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: var(--gutter);
  }
  /* One treatment for all four: the easy color over the dark ground. The
     opacity varies a little so four photos read as four photos. */
  .photo { position: relative; background: rgba(200, 237, 93, 0.16); }
  .photo:nth-child(2) { background: rgba(200, 237, 93, 0.22); }
  .photo:nth-child(3) { background: rgba(200, 237, 93, 0.12); }
  .photo:nth-child(4) { background: rgba(200, 237, 93, 0.19); }
  /* Labels sit in the outer corners, so the center stays clear for the plus. */
  .photo p { position: absolute; margin: 0; font-size: 15px; line-height: 1.6; color: var(--easy); }
  .photo:nth-child(1) p { left: 36px; top: 32px; }
  .photo:nth-child(2) p { right: 36px; top: 32px; text-align: right; }
  .photo:nth-child(3) p { left: 36px; bottom: 32px; }
  .photo:nth-child(4) p { right: 36px; bottom: 32px; text-align: right; }

  /* The plus, centered exactly on the gutter crossing. */
  .plus {
    position: absolute; width: var(--plus); height: var(--plus);
    left: calc(50% - var(--plus) / 2); top: calc(50% - var(--plus) / 2);
    color: var(--electric);
  }
</style>
</head>
<body>
<div class="canvas">

  <div class="grid">
    <div class="photo"><p class="mono">Photo<br>Industrial</p></div>
    <div class="photo"><p class="mono">Photo<br>Maritime</p></div>
    <div class="photo"><p class="mono">Photo<br>Agricultural</p></div>
    <div class="photo"><p class="mono">Photo<br>Technological</p></div>
  </div>

  <!-- LAIO-PLUS -->
  <svg class="plus" viewBox="0 0 70.49 70.49" aria-hidden="true">
    <polygon fill="currentColor" points="70.49 30.88 39.61 30.88 39.61 0 30.88 0 30.88 30.88 0 30.88 0 39.61 30.88 39.61 30.88 70.49 39.61 70.49 39.61 39.61 70.49 39.61 70.49 30.88"/>
  </svg>

</div>
</body>
</html>
